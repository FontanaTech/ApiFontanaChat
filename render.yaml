# Blueprint de Render. Plan gratuito para pruebas (se duerme tras 15 min sin tráfico).
# Los secretos (DATABASE_URL) se escriben en el panel de Render; nunca en este archivo.
services:
  - type: web
    name: fontanachat-api
    runtime: node
    plan: free
    # --include=dev: el build necesita TypeScript y Vite (devDependencies) aunque NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # El plan gratuito no tiene "pre-deploy command": las migraciones (idempotentes) corren al arrancar.
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 1
      # Modelo alojado (Render no incluye Ollama). Cualquier API compatible con OpenAI sirve; aquí Groq (plan gratuito).
      # Sin LLM_API_KEY el chat sigue funcionando: responde con el texto del sitio y pasa a WhatsApp.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_MS
        value: 15000
      - key: CHAT_CONTEXT_MAX_CHARS
        value: 8000
